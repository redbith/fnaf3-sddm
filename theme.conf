[General]
# Night number shown on the intro/splash screen (1-6 are classic, try higher for "fun")
NightNumber=3

# Main accent color, hex with leading #. Amber/orange = Fazbear's Fright
# neon-sign / warning-light vibe.
AccentColor=#4dff00

# Secondary accent for warnings / failed login flashes
DangerColor=#ff2d2d

# Background base color
BackgroundColor=#1f3b13

# Show the camera-feed style border around the login panel
ShowCameraFrame=true

# Seconds the intro "NIGHT X" sequence plays before the login form appears
IntroDuration=2

# Set to false to skip the intro every time and go straight to login
# (it will still play once when sddm-greeter first starts; this only
# controls whether it replays after a failed login)
ReplayIntroOnFail=false

# Font family fallback chain. Install a free pixel font (e.g. "Press Start 2P"
# from Google Fonts, SIL Open Font License) and put it in fonts/ for the
# authentic 8-bit look; otherwise it falls back to monospace.
FontFamily=Press Start 2P

# ---------------------------------------------------------------
# Background video (optional). Drop your own video file into the
# theme's media/ folder and point this at it with a path RELATIVE
# to this theme.conf file, e.g. media/menu-theme.webm
# Leave empty to just use the static/gradient background.
# ---------------------------------------------------------------
VideoSource=media/menu-theme.mp4

# true/false — mute the video's own embedded audio track
VideoMuted=false

# 0.0 - 1.0 — only used when VideoMuted=false
VideoVolume=0.6
